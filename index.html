<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li>Addy'sgame.com</li>
        </ul>
    </nav>

    <div class="gameContainer">
        <div class="win-line" id="winLine"></div>
        <div class="container">
            <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
            <div class="box bt-0"><span class="boxtext"></span></div>
            <div class="box bt-0 br-0"><span class="boxtext"></span></div>
            <div class="box bl-0"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box br-0"><span class="boxtext"></span></div>
            <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0 br-0"><span class="boxtext"></span></div>
        </div>
        <div class="gameInfo">
            <h1>Welcome To the Playground!</h1>
            <div class="playerNames">
                <input type="text" id="playerX" placeholder="Your Name (X)" />
                <input type="text" id="playerO" placeholder="Player O Name (for PvP)" />
            </div>
            <div class="modeSelect">
                <label><input type="radio" name="mode" value="pvp" checked> Player vs Player</label>
                <label><input type="radio" name="mode" value="ai"> Play vs AI</label>
            </div>
            <div>
                <span class="info">Turn For X</span>
                <button id="reset">Reset</button>
            </div>
            <div class="imgBox">
                <img id="celebrationGif" src="winning.gif" alt="gameover" style="display: none;" />
            </div>
        </div>
    </div>

    <audio id="winSound" src="crowd-cheer-applause-victory-fanfare-clapping-236698.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
